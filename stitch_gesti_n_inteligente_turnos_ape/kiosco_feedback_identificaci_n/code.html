<body class="bg-surface h-full flex flex-col font-body-lg text-on-surface">
<!-- Header / Brand Logo -->
<header class="w-full flex items-center justify-center p-kiosk-padding border-b border-outline-variant bg-surface-container-low">
<div class="flex items-center gap-4">
<img alt="Logo APE Turnos" class="h-[72px] w-auto object-contain" data-alt="A clean, modern, and professional corporate logo for APE Turnos on a light background. The logo should feature crisp typography and a simple geometric icon reflecting efficiency and organization. Use the primary blue (#050066) and high contrast. The mood is trustworthy and institutional, suitable for a government or large corporate service portal. Lighting is bright, studio-quality, emphasizing clarity." src="https://lh3.googleusercontent.com/aida/ADBb0uisUQzRftTPxo7wzOF8qXgi1P3NDatpBrW9gs-Rek4Ll8CPZmVSGoTAg1pWhLlqswtBCik9VI7U_XMWoqPvx0mu4CAZgyW5G7HVYPENrudtl_hNhp1DpTXR1qdgdK0LP8WJLBG1LtdF93TZrhzAnl8VsQXzjCr-hE7ZW7AkXmvRlzXw8YrbtkJkiPJHlrqgGdgVGerLzGyDCU0Si6wy1Mpk2LOi0Sy9y_H2OGwh_C6hFuJy9E0_T0tTGuEW8j6JffEDBKkLrTvAEcU"/>
</div>
</header>
<!-- Main Content Canvas - Kiosk Layout -->
<main class="flex-1 flex flex-col items-center justify-center p-kiosk-padding max-w-[800px] mx-auto w-full gap-tv-margin">
<!-- Header Text -->
<div class="text-center w-full">
<h1 class="font-h1-kiosk text-h1-kiosk text-primary mb-4">Identifica tu atención</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Por favor, ingresa tu número de documento para encontrar tu registro y calificar el servicio.</p>
</div>
<!-- Input Section -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-8 flex flex-col gap-8 shadow-sm">
<div class="flex flex-col gap-6">
<!-- Document Type Select -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="doc-type">Tipo de Documento</label>
<div class="relative">
<select class="w-full appearance-none h-[64px] bg-surface-container-low border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg px-6 focus:ring-2 focus:ring-primary focus:border-primary outline-none cursor-pointer" id="doc-type">
<option value="cc">Cédula de Ciudadanía</option>
<option value="ti">Tarjeta de Identidad</option>
<option value="ce">Cédula de Extranjería</option>
<option value="pa">Pasaporte</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Document Number Input -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="doc-number">Número de Documento</label>
<input class="w-full h-[64px] bg-surface-container-lowest border border-outline text-on-surface font-h2-dashboard text-h2-dashboard rounded-lg px-6 focus:ring-2 focus:ring-primary focus:border-primary outline-none text-center tracking-[0.1em]" id="doc-number" placeholder="Ej. 1020304050" readonly="" type="text" value=""/>
</div>
</div>
<!-- Tactile Numpad -->
<div class="grid grid-cols-3 gap-4 w-full max-w-[400px] mx-auto mt-4">
<!-- Row 1 -->
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">1</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">2</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">3</button>
<!-- Row 2 -->
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">4</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">5</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">6</button>
<!-- Row 3 -->
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">7</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">8</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">9</button>
<!-- Row 4 -->
<button aria-label="Limpiar todo" class="h-[80px] bg-surface-container text-on-surface-variant font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95 col-start-1">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<button class="h-[80px] bg-surface-container-high hover:bg-surface-dim text-on-surface font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">0</button>
<button aria-label="Borrar último dígito" class="h-[80px] bg-surface-container text-on-surface-variant font-h1-kiosk text-h2-dashboard rounded-xl border border-outline-variant flex items-center justify-center transition-colors shadow-sm active:scale-95">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
</div>

<div class="w-full mt-4">
<button class="w-full h-touch-target-min min-h-[80px] bg-primary text-on-primary font-h2-dashboard text-h2-dashboard rounded-xl flex items-center justify-center gap-4 hover:bg-primary-container transition-colors shadow-sm active:bg-on-primary-fixed-variant active:shadow-none">
<span class="material-symbols-outlined fill" data-icon="search" data-weight="fill">search</span>
                Buscar mi atención
            </button>
</div>
</main>
