<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-dashboard-gutter md:p-kiosk-padding relative overflow-hidden">
<!-- Background Decoration (Subtle) -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed opacity-30 blur-3xl"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-surface-variant opacity-50 blur-3xl"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm z-10 overflow-hidden relative">
<!-- Top Color Accent -->
<div class="h-2 bg-primary w-full"></div>
<div class="p-8">
<!-- Logo Container -->
<div class="flex justify-center mb-8">
<img alt="Logo APE y SENA" class="h-16 object-contain" data-alt="A professional, clean vector logo featuring the institutional branding of SENA and APE Turnos. The logo is displayed on a pure white background with sharp, modern typography and a minimalist corporate aesthetic. The lighting is even and flat, typical of high-quality corporate brand assets." src="https://lh3.googleusercontent.com/aida/ADBb0uisUQzRftTPxo7wzOF8qXgi1P3NDatpBrW9gs-Rek4Ll8CPZmVSGoTAg1pWhLlqswtBCik9VI7U_XMWoqPvx0mu4CAZgyW5G7HVYPENrudtl_hNhp1DpTXR1qdgdK0LP8WJLBG1LtdF93TZrhzAnl8VsQXzjCr-hE7ZW7AkXmvRlzXw8YrbtkJkiPJHlrqgGdgVGerLzGyDCU0Si6wy1Mpk2LOi0Sy9y_H2OGwh_C6hFuJy9E0_T0tTGuEW8j6JffEDBKkLrTvAEcU"/>
</div>
<!-- Headers -->
<div class="text-center mb-8">
<h1 class="font-h2-dashboard text-h2-dashboard text-on-surface mb-2">Inicio de Sesión Administrativo</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Ingrese sus credenciales para acceder a los paneles de gestión</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Username Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="username">Usuario o Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent h-touch-target-min transition-all duration-200" id="username" name="username" placeholder="ej. jdoe@sena.edu.co" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-3 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent h-touch-target-min transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Role Selector -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2">Rol</label>
<div class="grid grid-cols-2 gap-4">
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-DEFAULT cursor-pointer bg-surface hover:bg-surface-container-high transition-colors group">
<input checked="" class="sr-only peer" name="role" type="radio" value="asesor"/>
<div class="peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container absolute inset-0 rounded-DEFAULT border-2 border-transparent transition-all"></div>
<span class="relative z-10 font-label-bold text-label-bold flex items-center gap-2 group-hover:text-on-surface peer-checked:text-on-primary-container">
<span class="material-symbols-outlined text-lg">support_agent</span>
                                    Asesor
                                </span>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-DEFAULT cursor-pointer bg-surface hover:bg-surface-container-high transition-colors group">
<input class="sr-only peer" name="role" type="radio" value="coordinador"/>
<div class="peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container absolute inset-0 rounded-DEFAULT border-2 border-transparent transition-all"></div>
<span class="relative z-10 font-label-bold text-label-bold flex items-center gap-2 group-hover:text-on-surface peer-checked:text-on-primary-container">
<span class="material-symbols-outlined text-lg">manage_accounts</span>
                                    Coordinador
                                </span>
</label>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold h-touch-target-min rounded-DEFAULT hover:bg-primary hover:text-on-primary transition-all duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</div>
</div>
</main>
<!-- Footer Component Generated from JSON -->
<footer class="bg-surface-container-low dark:bg-surface-dim border-t border-outline-variant dark:border-outline full-width bottom-0 flex flex-col md:flex-row justify-between items-center w-full px-dashboard-gutter py-base gap-4 flat no shadows z-20">
<div class="flex items-center gap-2">
<span class="font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant dark:text-on-surface">© 2024 Servicio Nacional de Aprendizaje SENA - Agencia Pública de Empleo</span>
</div>
<nav class="flex flex-wrap items-center justify-center gap-4">
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors focus:ring-2 focus:ring-primary-container rounded-DEFAULT px-2 py-1" href="#">Términos y Condiciones</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors focus:ring-2 focus:ring-primary-container rounded-DEFAULT px-2 py-1" href="#">Política de Privacidad</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors focus:ring-2 focus:ring-primary-container rounded-DEFAULT px-2 py-1" href="#">Soporte Técnico</a>
</nav>
</footer>
</body></html>
