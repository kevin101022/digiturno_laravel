<body class="bg-background w-screen h-screen overflow-hidden flex flex-col p-tv-margin">
<!-- Main Content Canvas -->
<main class="flex-1 flex gap-tv-margin h-full">
<!-- Left Column: Current Turn (High Visibility Focus) -->
<!-- Elevation Level 2: Ambient shadow implied by deep color and isolation -->
<section class="w-2/3 bg-primary rounded-xl flex flex-col justify-center items-center relative overflow-hidden shadow-2xl">
<!-- Subtle ambient glow background element -->
<div class="absolute inset-0 bg-primary-container opacity-30 mix-blend-overlay"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="font-h2-dashboard text-h2-dashboard text-inverse-primary uppercase tracking-[0.2em] mb-base">Turno Actual</span>
<!-- TV Turn Cards: Syne Bold in Secondary Yellow against Primary Blue -->
<span class="font-display-queue text-display-queue text-secondary-container drop-shadow-lg">V-042</span>
</div>
<div class="relative z-10 mt-tv-margin bg-surface-tint/20 rounded-full px-tv-margin py-dashboard-gutter flex items-center gap-dashboard-gutter border border-surface-tint/30 backdrop-blur-sm">

<span class="font-h1-kiosk text-h1-kiosk text-secondary-fixed">Ventanilla 03</span>
</div>
</section>

<header class="bg-surface-container-high rounded-lg p-dashboard-gutter flex justify-center items-center shadow-sm">

</header>
<div class="flex-1 flex flex-col gap-base justify-start">
<!-- Elevation Level 1: Pure white surfaces with subtle border -->
<article class="bg-surface rounded-lg border border-outline-variant p-dashboard-gutter flex justify-between items-center shadow-sm h-32">
<span class="font-h1-kiosk text-h1-kiosk text-primary">V-043</span>
<div class="flex flex-col items-end">
<span class="font-label-bold text-label-bold text-outline uppercase">Ventanilla</span>
<span class="font-h1-kiosk text-h1-kiosk text-on-surface">01</span>
</div>
</article>
<article class="bg-surface rounded-lg border border-outline-variant p-dashboard-gutter flex justify-between items-center shadow-sm h-32">
<span class="font-h1-kiosk text-h1-kiosk text-primary">G-112</span>
<div class="flex flex-col items-end">
<span class="font-label-bold text-label-bold text-outline uppercase">Ventanilla</span>

</div>
</article>
<article class="bg-surface rounded-lg border border-outline-variant p-dashboard-gutter flex justify-between items-center shadow-sm h-32">

<div class="flex flex-col items-end">
<span class="font-label-bold text-label-bold text-secondary uppercase bg-secondary-fixed/50 px-base py-1 rounded-full">En Espera</span>
</div>

<article class="bg-surface rounded-lg border border-outline-variant p-dashboard-gutter flex justify-between items-center shadow-sm h-32 opacity-75">
<span class="font-h1-kiosk text-h1-kiosk text-outline-variant">P-009</span>
<div class="flex flex-col items-end">
<span class="font-label-bold text-label-bold text-outline uppercase bg-surface-variant px-base py-1 rounded-full">En Espera</span>
</div>
</article>
</div>
</aside>
</main>

<div class="flex items-center gap-dashboard-gutter w-2/3">
<span class="material-symbols-outlined text-primary" style="font-size: 64px;">info</span>
<span class="font-h2-dashboard text-h2-dashboard text-on-surface leading-tight">

            </span>
