<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>

                        "secondary": "#7d5700",
                        "secondary-fixed": "#ffdeab",
                        "surface-container-highest": "#e4e1ec",

                        "tv-margin": "64px",

                        "dashboard-gutter": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Plus Jakarta Sans"],
                        "h1-kiosk": ["Plus Jakarta Sans"],
                        "display-queue": ["Syne"],

                    },
                    "fontSize": {

                        "h1-kiosk": ["48px", { "lineHeight": "120%", "fontWeight": "700" }],

            }
        }

<style>
        /* Custom radio button styling for cards to hide default radio but handle state */
        input[type="radio"]:checked + div {
            border-color: var(--tw-prose-body); /* Fallback, handled by tailwind classes usually */
            transform: scale(0.98);
        }
        
        /* Apply dynamic outline based on checked state using peer class in Tailwind */
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- 
        Navigation Shell suppressed intentionally.
        Rule: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional... splash screens."
        This is a Kiosk top-level interaction.
    -->
<main class="flex-1 flex flex-col p-kiosk-padding max-w-7xl mx-auto w-full h-screen justify-between relative">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mt-8 space-y-8">
<div class="h-24 flex items-center justify-center mb-4">
<img alt="SENA Logo Placeholder" class="h-full w-auto object-contain mix-blend-multiply opacity-90 rounded-lg" data-alt="A clean, modern corporate logo placeholder displaying high-contrast typography in deep navy blue against a pure white background. The logo incorporates subtle geometric curves implying progress and efficiency. The lighting is studio-flat, ensuring perfect legibility and a highly professional, institutional aesthetic suitable for a government or public service entity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvNMvGthgSc1PvuyOoGQQcLPzRpjN1vPEDTZmImkjpSffEwsIsgNBxURLz6iAjpBJPdLDE9OQXlX0nxpsWXdvcX2-yyn8ipYPFAE7VK8_-GNv0sv4s_LIvlz22yTeuR-8LfpSAAg9-0Sh_15_SJWa5uVdcyC-4Jhl-MurQJ2Fehj_-U1cnvurZ5pwVpu9Bcy1p3-11R3kNS0OZYn-bUTyP9W1qhQ4uD9Y820DTi5IJlWcHiP60MT5zIc7jllPxPY-9JW8DMQznJr26"/>
</div>
<h1 class="font-h1-kiosk text-h1-kiosk text-on-surface max-w-4xl leading-tight">
                Seleccione su tipo de atención
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">
                Por favor, elija la categoría que mejor describa su perfil para asignarle el turno correspondiente.
            </p>
</header>
<!-- Category Selection Grid (Kiosk 4-column fluid approach, adapted to 2x2 for large touch targets) -->
<section class="flex-1 flex items-center justify-center my-12 w-full">
<form class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-5xl">
<!-- Opción: Víctima -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="categoria" type="radio" value="victima"/>
<div class="h-64 rounded-xl border-2 border-outline-variant bg-surface-container-lowest p-8 flex flex-col items-center justify-center text-center transition-all duration-200 ease-in-out hover:bg-surface-container peer-checked:bg-error-container peer-checked:border-error peer-checked:shadow-inner active:scale-95 group">
<span class="material-symbols-outlined text-[80px] text-tertiary-container mb-6 group-hover:scale-110 transition-transform peer-checked:text-on-error-container" style="font-variation-settings: 'FILL' 0;">
                            accessibility_new
                        </span>
<h2 class="font-h2-dashboard text-h2-dashboard text-on-surface peer-checked:text-on-error-container">Víctima</h2>
</div>
</label>
<!-- Opción: Prioritario -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="categoria" type="radio" value="prioritario"/>
<div class="h-64 rounded-xl border-2 border-outline-variant bg-surface-container-lowest p-8 flex flex-col items-center justify-center text-center transition-all duration-200 ease-in-out hover:bg-surface-container peer-checked:bg-secondary-container peer-checked:border-secondary peer-checked:shadow-inner active:scale-95 group">
<span class="material-symbols-outlined text-[80px] text-secondary mb-6 group-hover:scale-110 transition-transform peer-checked:text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">
                            stars
                        </span>
<h2 class="font-h2-dashboard text-h2-dashboard text-on-surface peer-checked:text-on-secondary-container">Prioritario</h2>
</div>
</label>
<!-- Opción: Empresario -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="categoria" type="radio" value="empresario"/>
<div class="h-64 rounded-xl border-2 border-outline-variant bg-surface-container-lowest p-8 flex flex-col items-center justify-center text-center transition-all duration-200 ease-in-out hover:bg-surface-container peer-checked:bg-primary-container peer-checked:border-primary peer-checked:shadow-inner active:scale-95 group">
<span class="material-symbols-outlined text-[80px] text-primary mb-6 group-hover:scale-110 transition-transform peer-checked:text-on-primary-container" style="font-variation-settings: 'FILL' 0;">
                            domain
                        </span>
<h2 class="font-h2-dashboard text-h2-dashboard text-on-surface peer-checked:text-on-primary-container">Empresario</h2>
</div>
</label>
<!-- Opción: General -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="categoria" type="radio" value="general"/>
<div class="h-64 rounded-xl border-2 border-outline-variant bg-surface-container-lowest p-8 flex flex-col items-center justify-center text-center transition-all duration-200 ease-in-out hover:bg-surface-container peer-checked:bg-surface-tint peer-checked:border-primary peer-checked:shadow-inner active:scale-95 group">
<span class="material-symbols-outlined text-[80px] text-primary mb-6 group-hover:scale-110 transition-transform peer-checked:text-on-primary" style="font-variation-settings: 'FILL' 0;">
                            person
                        </span>
<h2 class="font-h2-dashboard text-h2-dashboard text-on-surface peer-checked:text-on-primary">General</h2>
</div>
</label>
</form>
</section>
<!-- Action Footer -->
<footer class="flex justify-center mt-auto mb-8 w-full">
<button class="w-full max-w-3xl h-32 bg-primary text-on-primary rounded-xl flex items-center justify-center transition-colors duration-200 hover:bg-on-primary-fixed-variant active:bg-primary-container active:text-on-primary-container disabled:opacity-50 disabled:cursor-not-allowed shadow-sm group">
<span class="font-h1-kiosk text-h1-kiosk mr-6">Obtener Ticket</span>
<span class="material-symbols-outlined text-[64px] group-hover:translate-x-2 transition-transform" style="font-variation-settings: 'FILL' 0;">
                    arrow_forward_ios
                </span>
</button>
</footer>
</main>
</body></html>
